# Render Blueprint for FINANCE_FLAG.
#
# Import: Render dashboard -> New -> Blueprint -> connect this GitHub repo.
# Render will read this file and offer to create everything below in one step.
#
# NOTE ON COST: everything in this blueprint (web, Postgres, Redis) runs on Render's
# free plan. The Celery worker (which runs document analysis) is deliberately left
# OUT of this blueprint because background workers require a paid plan (~$7/month
# Starter), which also forces Render to ask for a credit card just to import the
# blueprint at all. Add it later yourself once you're ready to pay: Render dashboard
# -> New -> Background Worker -> same repo -> Dockerfile path ./backend/Dockerfile,
# Docker context ./backend, start command:
#   celery -A app.services.worker.celery_app worker -l info --concurrency=2
# and copy the same env vars as financeflag-backend below.
#
# Any envVar marked `sync: false` is a secret Render will prompt you to paste in
# during setup rather than storing in this file.

databases:
  - name: financeflag-db
    databaseName: finai
    user: finai
    plan: free

services:
  - type: redis
    name: financeflag-redis
    plan: free
    ipAllowList: []

  - type: web
    name: financeflag-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: financeflag-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: financeflag-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: VECTOR_STORE
        value: faiss
      - key: OCR_PROVIDER
        value: tesseract
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # from https://console.groq.com/keys
      - key: GROQ_CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: NEWSDATA_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
